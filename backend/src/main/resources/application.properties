spring.application.name=leads

# Render (y la mayoria de PaaS) inyectan el puerto real en runtime via
# la variable de entorno PORT -- sin esto la app queda fija en el 8080
# por defecto de Spring Boot y no responde donde el proveedor espera.
server.port=${PORT:8080}

# DB_URL permite pasar la URL JDBC completa (Neon exige sslmode=require,
# que no se puede expresar con solo host/puerto/nombre). Sin DB_URL, el
# comportamiento local queda identico al de siempre.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:leads}}
spring.datasource.username=${DB_USER:leads}
spring.datasource.password=${DB_PASSWORD:leads}

management.endpoint.health.show-details=when-authorized
# La notificacion por correo es best-effort (ver HU-18): su disponibilidad
# no debe afectar el healthcheck general del sitio.
management.health.mail.enabled=false

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Apagados por defecto: el correo local de desarrollo (Mailpit/GreenMail)
# es SMTP plano sin autenticacion. En produccion (Gmail con App
# Password): MAIL_SMTP_AUTH=true y MAIL_SMTP_STARTTLS=true, con
# MAIL_HOST=smtp.gmail.com y MAIL_PORT=587.
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.notificaciones.correo-destino=${NOTIFICACIONES_CORREO_DESTINO:admin@crearcodecesar.com}

# Remitente de todos los correos del sitio. Se fija explicito porque el
# usuario SMTP no siempre es una direccion (en Resend es literalmente
# "resend") y los servicios transaccionales rechazan con 422 cualquier
# remitente que no pertenezca a un dominio verificado.
app.correo.remitente=${MAIL_FROM:Crear Code Cesar <contacto@crearcodecesar.com>}
app.correo.responder-a=${MAIL_REPLY_TO:contacto@crearcodecesar.com}

# URL publica del frontend, usada para armar los enlaces de los correos
# de verificacion/recuperacion (fase F8). En Render: la URL real del
# servicio del frontend. Nunca hardcodeada (ADR-06).
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

app.legal.version-politica-datos=${VERSION_POLITICA_DATOS:v1}

# Credenciales de desarrollo local unicamente -- en cualquier entorno
# real estas variables de entorno son obligatorias y propias.
# ADMIN_USERNAME ahora debe ser un correo valido (se usa como Correo del
# Usuario sembrado al arrancar, ver ADR-08 en docs/02-arquitectura.md):
# si ya estaba seteado como un usuario sin formato de correo en algun
# entorno real, hay que actualizarlo.
app.admin.username=${ADMIN_USERNAME:admin@crearcode-cesar.local}
app.admin.password=${ADMIN_PASSWORD:cambiar-en-produccion}

# Un visitante real no envia el formulario de contacto 20 veces en 10
# minutos; este umbral protege contra rafagas de spam sin friccion
# para el uso normal.
app.rate-limit.max-solicitudes=${RATE_LIMIT_MAX_SOLICITUDES:20}
app.rate-limit.ventana-minutos=${RATE_LIMIT_VENTANA_MINUTOS:10}

# Umbral propio y mas estricto para el login del panel admin (proteccion
# de fuerza bruta), separado del umbral del formulario de contacto.
app.rate-limit.login.max-intentos=${RATE_LIMIT_LOGIN_MAX_INTENTOS:5}
app.rate-limit.login.ventana-minutos=${RATE_LIMIT_LOGIN_VENTANA_MINUTOS:15}

# Umbrales por IP de los endpoints de cuentas de cliente (fase F8).
# Respaldo grueso: en produccion todas las peticiones llegan via el
# proxy SSR del frontend y comparten IP aparente, asi que la proteccion
# fina contra bombardeo de correos es el limite por correo en la capa
# de aplicacion (3 tokens/15 min por usuario y proposito).
app.rate-limit.registro.max-intentos=${RATE_LIMIT_REGISTRO_MAX_INTENTOS:5}
app.rate-limit.registro.ventana-minutos=${RATE_LIMIT_REGISTRO_VENTANA_MINUTOS:60}
app.rate-limit.verificacion.max-intentos=${RATE_LIMIT_VERIFICACION_MAX_INTENTOS:10}
app.rate-limit.verificacion.ventana-minutos=${RATE_LIMIT_VERIFICACION_VENTANA_MINUTOS:15}
app.rate-limit.reenvio-verificacion.max-intentos=${RATE_LIMIT_REENVIO_MAX_INTENTOS:3}
app.rate-limit.reenvio-verificacion.ventana-minutos=${RATE_LIMIT_REENVIO_VENTANA_MINUTOS:15}
app.rate-limit.recuperacion.max-intentos=${RATE_LIMIT_RECUPERACION_MAX_INTENTOS:3}
app.rate-limit.recuperacion.ventana-minutos=${RATE_LIMIT_RECUPERACION_VENTANA_MINUTOS:15}
app.rate-limit.restablecimiento.max-intentos=${RATE_LIMIT_RESTABLECIMIENTO_MAX_INTENTOS:5}
app.rate-limit.restablecimiento.ventana-minutos=${RATE_LIMIT_RESTABLECIMIENTO_VENTANA_MINUTOS:15}
app.rate-limit.asistente.max-intentos=${RATE_LIMIT_ASISTENTE_MAX_INTENTOS:30}
app.rate-limit.asistente.ventana-minutos=${RATE_LIMIT_ASISTENTE_VENTANA_MINUTOS:15}

# Limites de uso del asistente IA (fase F9, HU-38, ADR-10): se aplican
# en la capa de aplicacion ANTES de llamar al proveedor. El global es
# el techo real (capa gratis de Groq ~1000/dia, con margen); el
# registrado es mayor que el anonimo a proposito (beneficio de la
# cuenta, HU-34).
app.asistente.limite-global-diario=${ASISTENTE_LIMITE_GLOBAL_DIARIO:800}
app.asistente.limite-diario-registrado=${ASISTENTE_LIMITE_REGISTRADO:50}
app.asistente.limite-diario-anonimo=${ASISTENTE_LIMITE_ANONIMO:10}

# Simulador de chatbot (F10b): limites diarios propios, separados de
# los del asistente (cada herramienta tiene su cupo).
app.simulador.limite-global-diario=${SIMULADOR_LIMITE_GLOBAL_DIARIO:400}
app.simulador.limite-diario-registrado=${SIMULADOR_LIMITE_REGISTRADO:50}
app.simulador.limite-diario-anonimo=${SIMULADOR_LIMITE_ANONIMO:10}

# Diagnostico digital (F10c): limites propios (cada herramienta tiene
# su cupo — prototipo aprobado: 2 anonimo / 10 con cuenta).
app.diagnostico.limite-global-diario=${DIAGNOSTICO_LIMITE_GLOBAL_DIARIO:200}
app.diagnostico.limite-diario-registrado=${DIAGNOSTICO_LIMITE_REGISTRADO:10}
app.diagnostico.limite-diario-anonimo=${DIAGNOSTICO_LIMITE_ANONIMO:2}

# Demo de diseno con IA (F10d). Proveedor de imagenes conmutable:
# pollinations (interino, gratis sin key) | gemini (cuando su capa
# gratis vuelva a incluir imagenes o haya billing — verificado 10 ago
# 2026 con limite 0). La key SOLO por entorno (.env local / Render).
app.demo.proveedor-imagenes=${DEMO_PROVEEDOR_IMAGENES:pollinations}
app.demo.pollinations.url=${POLLINATIONS_URL:https://image.pollinations.ai}
app.demo.pollinations.timeout-segundos=${POLLINATIONS_TIMEOUT_SEGUNDOS:60}
app.demo.gemini.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
app.demo.gemini.key=${GEMINI_API_KEY:}
app.demo.gemini.modelo=${GEMINI_MODELO:gemini-2.5-flash-image}
app.demo.gemini.timeout-segundos=${GEMINI_TIMEOUT_SEGUNDOS:40}
# Cloudflare Workers AI: primario cuando DEMO_PROVEEDOR_IMAGENES=cloudflare
# (Pollinations queda de respaldo automatico). Credenciales solo por
# entorno: .env local / dashboard de Render.
app.demo.cloudflare.url=${CLOUDFLARE_API_URL:https://api.cloudflare.com/client/v4}
app.demo.cloudflare.cuenta=${CLOUDFLARE_ACCOUNT_ID:}
app.demo.cloudflare.token=${CLOUDFLARE_API_TOKEN:}
app.demo.cloudflare.modelo=${CLOUDFLARE_MODELO_IMAGEN:@cf/black-forest-labs/flux-1-schnell}
app.demo.cloudflare.timeout-segundos=${CLOUDFLARE_TIMEOUT_SEGUNDOS:60}
app.demo.limite-global-diario=${DEMO_LIMITE_GLOBAL_DIARIO:100}

# Cotizaciones (fase F11). La validez por defecto y el impuesto son
# datos comerciales pendientes de confirmar con el usuario (ver
# docs/05-backlog-issues.md): 0% de impuesto es un valor valido.
app.cotizaciones.dias-validez-por-defecto=${COTIZACIONES_DIAS_VALIDEZ:15}
# 19% por decision del usuario (11 ago 2026): una S.A.S. es persona
# juridica y por regla general responsable de IVA — cotizar sin el y
# descubrirlo despues obliga a pedirle al cliente un 19% extra sobre algo
# que ya acepto. Si el contador confirma que no aplica, se baja aqui o
# por cotizacion.
app.cotizaciones.impuesto-por-defecto=${COTIZACIONES_IMPUESTO:19}

# Encabezado del PDF de la cotizacion. NIT, direccion y razon social
# salen del certificado de existencia y representacion legal de la
# Camara de Comercio de Valledupar (matricula 220369, expedido el 16 jul
# 2026). Si alguno quedara vacio, el PDF omite esa linea en vez de
# imprimir un dato inventado.
app.empresa.razon-social=${EMPRESA_RAZON_SOCIAL:Crear Code Cesar S.A.S.}
app.empresa.nit=${EMPRESA_NIT:901941017-0}
app.empresa.direccion=${EMPRESA_DIRECCION:Calle 4B # 20-36, Oficina 303, Barrio Callejas}
app.empresa.ciudad=${EMPRESA_CIUDAD:Valledupar, Cesar}
app.empresa.telefono=${EMPRESA_TELEFONO:323 988 5883}
app.empresa.correo=${EMPRESA_CORREO:admin@crearcodecesar.com}
app.empresa.sitio-web=${EMPRESA_SITIO_WEB:crearcodecesar.com}
app.demo.limite-diario-registrado=${DEMO_LIMITE_REGISTRADO:3}

# Proveedor de IA (ADR-10). La key SOLO por variable de entorno: .env
# local (gitignored) o el dashboard de Render — nunca en el repo. La
# URL es configurable para apuntar los tests/e2e a un stub local.
app.asistente.groq.url=${GROQ_API_URL:https://api.groq.com/openai/v1}
app.asistente.groq.key=${GROQ_API_KEY:}
app.asistente.groq.modelo=${GROQ_MODELO:llama-3.3-70b-versatile}
app.asistente.groq.timeout-segundos=${GROQ_TIMEOUT_SEGUNDOS:20}

# Secreto de firma HS256 de los JWT del panel admin: DEBE tener al menos
# 32 bytes (lo exige la libreria de firma) y ser un valor real y secreto
# en cualquier entorno que no sea desarrollo local -- nunca el default
# de abajo.
app.jwt.secreto=${JWT_SECRET:cambiar-este-secreto-en-produccion-1234567890}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:480}

