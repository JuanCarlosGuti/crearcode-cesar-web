# Sitio (Angular prerenderizado servido por Caddy) — ADR-13.
#
# Se lleva todo el host menos lo que empieza por /api y /actuator, que
# kamal-proxy entrega al backend (config/deploy.api.yml). Este archivo
# no declara prefijos justamente por eso: es el que recoge el resto.
#
# ESTE SE DESPLIEGA PRIMERO, siempre. El certificado del host solo lo
# puede pedir el servicio de la raiz, que es este; si el backend fuera
# primero contra un host vacio, su ruta quedaria registrada pero sin
# quien pidiera el certificado, y /api se serviria sin HTTPS hasta que
# llegara el sitio. Estrictamente solo importa en el primer despliegue,
# pero se deja fijo para no tener que acordarse de cuando aplicaba.
#
# Ojo: es al reves que en UparYa, donde la API va primero porque su
# frontend la necesita para renderizar. Aqui el sitio es estatico y no
# llama a la API para pintarse, asi que manda la restriccion del TLS.
# Copiar el orden de UparYa por inercia deja el primer despliegue sin
# certificado.
service: crearcodecesar-web
image: juancarlosguti/crearcodecesar-web

servers:
  web:
    - 159.195.235.225

ssh:
  user: deploy

proxy:
  # El TLS del host lo pide ESTE servicio, el de la raiz: kamal-proxy
  # solo lo acepta aqui y lo rechaza en el que lleva prefijo de ruta
  # (ver config/deploy.api.yml). El certificado que emite cubre tambien
  # las peticiones que acaban en el backend.
  ssl: true
  # Redundante con ssl: true, que ya lo deja en false. Se declara igual
  # para que los dos archivos se lean iguales: en la API no es
  # redundante sino imprescindible, y una clave que aparece en uno y no
  # en otro obliga a averiguar si la diferencia es intencional.
  forward_headers: false
  hosts:
    - crearcodecesar.com
    - www.crearcodecesar.com
  app_port: 8080
  healthcheck:
    # La responde el propio Caddyfile con un 200 fijo, para no depender
    # de que exista una ruta de la aplicacion.
    path: /up
    interval: 5
    timeout: 10

# Caddy arranca en milisegundos; lo que tarda es descargar la imagen.
deploy_timeout: 60

registry:
  server: ghcr.io
  username: juancarlosguti
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  context: frontend
  dockerfile: frontend/Dockerfile
  cache:
    type: registry
    options: mode=max
    image: juancarlosguti/crearcodecesar-web-build-cache

# Sin variables de entorno: el sitio es estatico y no habla con nadie.
# La URL del backend no aparece por ningun lado porque el navegador pide
# /api al mismo host (ADR-09) y de ahi en adelante es cosa de
# kamal-proxy. El 301 de www al dominio raiz lo hace el Caddyfile.
