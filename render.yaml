# Blueprint de Render (ISS-082): define los dos web services (backend y
# frontend) construidos desde sus Dockerfile de produccion (ISS-081).
# La base de datos NO va aqui: es PostgreSQL gestionado en Neon (capa
# gratis, ver docs/09-despliegue.md) — sus credenciales se ingresan como
# variables de entorno al crear el Blueprint (sync: false = Render las
# pide en el dashboard y nunca quedan en el repo).
services:
  - type: web
    name: crearcodecesar-backend
    runtime: docker
    rootDir: backend
    plan: free
    region: virginia
    healthCheckPath: /actuator/health
    # Solo redesplegar cuando cambie el backend (o este blueprint) — los
    # commits de docs/frontend no deben reconstruir este servicio.
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      # URL JDBC completa de Neon, ej.:
      # jdbc:postgresql://ep-xxxxx.us-east-1.aws.neon.tech/leads?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Debe ser un correo valido (ver ADR-08).
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Render genera un valor aleatorio seguro (cumple el minimo de 32
      # bytes que exige la firma HS256 del JWT).
      - key: JWT_SECRET
        generateValue: true
      # URL publica del frontend: base de los enlaces de los correos de
      # verificacion/recuperacion (fase F8). Con dominio propio (ADR-11)
      # los correos enlazan al dominio canonico, no a onrender.com.
      - key: FRONTEND_URL
        value: https://crearcodecesar.com
      # Envio transaccional por Resend (11 ago 2026). Su usuario SMTP es
      # la palabra literal "resend" y la contrasena es la API key; el
      # remitente NO puede salir de ahi, por eso va explicito en
      # MAIL_FROM. Resend rechaza con 422 cualquier remitente que no
      # pertenezca a un dominio verificado en su panel.
      - key: MAIL_HOST
        value: smtp.resend.com
      - key: MAIL_USERNAME
        value: resend
      # Remitente y direccion de respuesta de todos los correos del
      # sitio. contacto@ (con o final) debe existir como buzon real: es
      # donde llegan las respuestas de los clientes.
      - key: MAIL_FROM
        value: Crear Code Cesar <contacto@crearcodecesar.com>
      - key: MAIL_REPLY_TO
        value: contacto@crearcodecesar.com
      # 2587 y no 587: Render bloquea el trafico saliente a los puertos
      # SMTP clasicos (25, 465, 587) en las instancias free desde sept
      # 2025, y no los rechaza sino que los descarta — el envio se queda
      # colgado hasta el timeout y el correo nunca sale. Resend expone
      # 2587 con STARTTLS igual que el 587.
      - key: MAIL_PORT
        value: "2587"
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_SMTP_STARTTLS
        value: "true"
      # La API key de Resend (empieza por re_) hace de contrasena. Se
      # ingresa en el dashboard, nunca en el repo.
      - key: MAIL_PASSWORD
        sync: false
      # Asistente IA (fase F9, ADR-10): la key de Groq se ingresa en el
      # dashboard — nunca en el repo. URL, modelo y limites tienen
      # defaults en application.properties.
      - key: GROQ_API_KEY
        sync: false
      # En produccion TODOS los visitantes comparten la IP del proxy
      # SSR (leccion F8): el default de 30/15min bloqueaba las
      # herramientas con trafico real (verificado 10 ago 2026). La
      # proteccion fina son los cupos diarios por sesion/usuario en la
      # capa de aplicacion; este es solo un techo anti-abuso global.
      # Follow-up ISS-136: propagar X-Forwarded-For para volver al
      # limite por IP real.
      - key: RATE_LIMIT_ASISTENTE_MAX_INTENTOS
        value: "600"
      # Demo de diseno (ISS-137): Cloudflare Workers AI como proveedor
      # primario, con Pollinations de respaldo automatico si falla.
      # Las dos credenciales se ingresan en el dashboard — nunca en el
      # repo. Si quedan vacias, cada generacion gastaria un intento
      # fallido antes de caer al respaldo: en ese caso, volver el
      # proveedor a "pollinations".
      - key: DEMO_PROVEEDOR_IMAGENES
        value: cloudflare
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false

  - type: web
    # Static Site, no web service (ADR-12, 11 ago 2026): el SSR no
    # aportaba nada al SEO — las paginas publicas ya se prerenderizan en
    # build — y como web service el sitio se dormia a los 15 minutos.
    # Servido por CDN, sin Node en produccion y sin spin down.
    # Nombre nuevo a proposito: Render NO convierte un web service en
    # Static Site, son tipos distintos. Con el nombre viejo el Blueprint
    # seguiria intentando construir el Dockerfile que ya no existe. Este
    # se crea al lado, se verifica en su URL de onrender.com y solo
    # entonces se le mueve el dominio y se borra el anterior
    # (procedimiento en docs/09-despliegue.md §8).
    name: crearcodecesar-sitio
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    routes:
      # Reemplaza al proxy de Express y mantiene vivo el ADR-09: el
      # navegador sigue viendo un solo origen, asi que el proyecto sigue
      # sin necesitar CORS.
      - type: rewrite
        source: /api/*
        destination: https://crearcodecesar-backend.onrender.com/api/*
      # Fallback de SPA para las rutas de sesion (admin, mi-cuenta y las
      # de token). Apunta a index.csr.html y NO a index.html: este
      # ultimo es la Home ya prerenderizada, y servirla bajo /admin
      # mostraria el contenido de la Home hasta que el router lo
      # corrigiera. Render no aplica rewrites donde ya existe un
      # archivo, asi que las 19 rutas prerenderizadas se sirven tal cual.
      - type: rewrite
        source: /*
        destination: /index.csr.html
    headers:
      # HSTS (ADR-11). Arranque conservador de 1 dia; la escalera
      # habitual es 86400 -> 604800 -> 2592000 -> 31536000, dejando unos
      # dias en cada escalon. "preload" NO se agrega: es practicamente
      # irreversible.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=86400; includeSubDomains
