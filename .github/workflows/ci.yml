name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Spring Boot + ArchUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: mvn verify (unitarias + ArchUnit + integracion con Testcontainers)
        working-directory: backend
        run: ./mvnw --batch-mode verify

  frontend:
    name: Frontend (Angular build + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: npm test (Vitest)
        working-directory: frontend
        run: npm test -- --watch=false

      - name: npm run build (SSR)
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E (Playwright, flujo de contacto + accesibilidad axe-core)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: leads
          POSTGRES_USER: leads
          POSTGRES_PASSWORD: leads
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U leads -d leads"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Empaquetar e iniciar backend
        working-directory: backend
        run: |
          ./mvnw --batch-mode -DskipTests package
          nohup java -jar target/*.jar --server.port=8080 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Instalar navegadores Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Iniciar frontend (dev server con proxy a /api)
        working-directory: frontend
        run: |
          nohup npx ng serve --port 4200 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4200 && break
            sleep 2
          done

      - name: npx playwright test
        working-directory: frontend
        run: npx playwright test

      - name: Logs del backend (si el e2e falla)
        if: failure()
        run: cat /tmp/backend.log
