name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (Spring Boot + ArchUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: mvn verify (unitarias + ArchUnit + integracion con Testcontainers)
        working-directory: backend
        run: ./mvnw --batch-mode verify

  frontend:
    name: Frontend (Angular build + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Misma version que Render usa para construir (NODE_VERSION en
          # render.yaml): si CI valida con otra, un fallo de version del
          # CLI aparece recien en el deploy. Al subirla alla, subirla aqui.
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: npm test (Vitest)
        working-directory: frontend
        run: npm test -- --watch=false

      - name: npm run build (prerender estatico)
        working-directory: frontend
        run: npm run build

      # Comprueba que las reglas de render.yaml sirvan de verdad las
      # paginas prerenderizadas: sin esto, un comodin mal puesto deja
      # todo el sitio respondiendo el cascaron del SPA con 200 y solo se
      # nota mirando el html de la primera respuesta (ADR-12).
      - name: Verificar rutas del Static Site (render.yaml)
        working-directory: frontend
        run: npm run verificar:rutas

  docker-build:
    # El frontend vuelve a tener imagen (ADR-13): en el servidor propio
    # kamal-proxy enruta por dominio pero no sirve archivos, asi que el
    # sitio viaja con Caddy dentro. En Render, mientras siga vivo, se
    # despliega como Static Site desde el mismo build.
    name: Docker (verifica que las imagenes construyan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker build backend
        run: docker build backend/

      - name: docker build frontend (Caddy)
        run: docker build -t sitio-ci frontend/

      # Levanta la imagen recien construida y comprueba, ruta por ruta,
      # que la PRIMERA respuesta trae la pagina prerenderizada y no el
      # cascaron del SPA. Es la red que protege la traduccion de las
      # reglas de Render al Caddyfile.
      #
      # La lista de rutas sale del propio artefacto (se copia /srv desde
      # el contenedor), asi que no hay que reconstruir el sitio con npm
      # ni mantener una lista a mano.
      - name: Verificar las rutas que sirve la imagen
        run: |
          docker run -d --name sitio-ci -p 4310:8080 sitio-ci
          for i in $(seq 1 20); do curl -sf http://localhost:4310/up && break; sleep 1; done
          docker cp sitio-ci:/srv "$RUNNER_TEMP/browser"
          mkdir -p frontend/dist/frontend
          cp -r "$RUNNER_TEMP/browser" frontend/dist/frontend/browser
          node frontend/scripts/verificar-rutas-servidas.mjs http://localhost:4310
          docker rm -f sitio-ci

  e2e:
    name: E2E (Playwright, contacto + cuentas + asistente + accesibilidad axe-core)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: leads
          POSTGRES_USER: leads
          POSTGRES_PASSWORD: leads
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U leads -d leads"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # SMTP de prueba para el e2e de cuentas (fase F8): el backend envia
      # a localhost:1025 (sus defaults) y el test lee el enlace del correo
      # via la API REST de Mailpit en el puerto 8025.
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          # Misma version que Render usa para construir (NODE_VERSION en
          # render.yaml): si CI valida con otra, un fallo de version del
          # CLI aparece recien en el deploy. Al subirla alla, subirla aqui.
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Iniciar stub de Groq (asistente IA, sin red externa)
        run: nohup node frontend/e2e/stub-groq.mjs > /tmp/stub-groq.log 2>&1 &

      - name: Empaquetar e iniciar backend
        working-directory: backend
        env:
          # El asistente apunta al stub local; limite anonimo bajo para
          # que el e2e de HU-38 sea verificable en pocos mensajes.
          GROQ_API_URL: http://localhost:9099/openai/v1
          # El mismo stub sirve las imagenes del demo de diseno (F10d)
          POLLINATIONS_URL: http://localhost:9099
          ASISTENTE_LIMITE_ANONIMO: "3"
          # La suite entera corre desde una sola IP, asi que los limites
          # por IP la estrangulan: con los defaults de produccion (login
          # 5/15min, registro 5/60min, contacto 20/10min) los ultimos
          # specs se quedaban sin cupo y fallaban por 429 disfrazado de
          # "elemento no encontrado". Se suben SOLO aqui; el filtro sigue
          # cubierto por RateLimitingFilterIT, que prueba los umbrales de
          # verdad.
          RATE_LIMIT_MAX_SOLICITUDES: "1000"
          RATE_LIMIT_LOGIN_MAX_INTENTOS: "1000"
          RATE_LIMIT_REGISTRO_MAX_INTENTOS: "1000"
          RATE_LIMIT_VERIFICACION_MAX_INTENTOS: "1000"
          RATE_LIMIT_REENVIO_MAX_INTENTOS: "1000"
          RATE_LIMIT_RECUPERACION_MAX_INTENTOS: "1000"
          RATE_LIMIT_RESTABLECIMIENTO_MAX_INTENTOS: "1000"
          RATE_LIMIT_ASISTENTE_MAX_INTENTOS: "1000"
        run: |
          ./mvnw --batch-mode -DskipTests package
          nohup java -jar target/*.jar --server.port=8080 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Instalar navegadores Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Iniciar frontend (dev server con proxy a /api)
        working-directory: frontend
        run: |
          nohup npx ng serve --port 4200 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4200 && break
            sleep 2
          done

      - name: npx playwright test
        working-directory: frontend
        run: npx playwright test

      - name: Logs del backend (si el e2e falla)
        if: failure()
        run: cat /tmp/backend.log

  desplegar:
    name: Desplegar al servidor propio (Kamal)
    # El gate: el despliegue cuelga de TODAS las pruebas. Por esto el
    # despliegue vive en este workflow y no en uno aparte — `needs:` no
    # cruza workflows, y partirlo obligaria a duplicar las pruebas o a
    # dejar el despliegue sin condicion, que es la propiedad que menos
    # conviene perder: no se nota hasta el dia que sale algo roto en
    # verde.
    needs: [backend, frontend, docker-build, e2e]
    # La variable DESPLIEGUE_SERVIDOR_PROPIO es el interruptor del
    # corte, y no sobra: sin ella este job se activaria en el mismo push
    # que lo introduce. El despliegue del sitio no necesita mas secreto
    # que el GITHUB_TOKEN de la ejecucion, asi que funcionaria — y
    # registraria crearcodecesar.com en kamal-proxy pidiendo certificado
    # para un dominio que todavia apunta a Render. Let's Encrypt limita
    # a 5 validaciones fallidas por hostname y hora, asi que ese
    # accidente no solo falla: gasta la cuota que hace falta el dia del
    # corte de verdad.
    #
    # Se crea en Settings -> Secrets and variables -> Actions ->
    # Variables, con valor "true", el dia que el DNS ya apunte al
    # servidor. Mientras no exista, el job se salta (no falla). Y sirve
    # despues como freno de mano: borrarla detiene los despliegues sin
    # tocar codigo.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master'
      && vars.DESPLIEGUE_SERVIDOR_PROPIO == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Para publicar las imagenes en GHCR con el GITHUB_TOKEN de la
      # ejecucion. No hace falta crear ningun secreto para esto.
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Sin esto solo viene un commit y el diff de abajo falla.
          fetch-depth: 0

      - name: Detectar que cambio en este push
        id: cambios
        run: |
          BASE="${{ github.event.before }}"

          # Rama nueva, force-push o historial recortado: se despliega
          # todo, que es el lado seguro.
          if [ -z "$BASE" ] || ! git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Cambiaron:"
          git diff --name-only "$BASE" "${{ github.sha }}"

          # Por exclusion y no por lista de patrones: solo se OMITE un
          # despliegue cuando TODOS los cambios caen dentro del otro
          # proyecto. Lo ambiguo (la raiz, docs, config/, el propio
          # workflow) despliega los dos.
          #
          # La direccion del fallo es lo que importa: con una lista de
          # patrones, un archivo en una ruta que nadie listo no dispara
          # nada, el servidor se queda con la version vieja y ningun
          # paso sale en rojo. Un despliegue que no ocurre y no avisa es
          # peor que uno de mas.
          SOLO_FRONT=true
          SOLO_BACK=true
          while IFS= read -r archivo; do
            case "$archivo" in
              frontend/*) SOLO_BACK=false ;;
              backend/*)  SOLO_FRONT=false ;;
              *)          SOLO_FRONT=false; SOLO_BACK=false ;;
            esac
          done < <(git diff --name-only "$BASE" "${{ github.sha }}")

          if [ "$SOLO_FRONT" = true ]; then echo "api=false" >> "$GITHUB_OUTPUT"; else echo "api=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$SOLO_BACK"  = true ]; then echo "web=false" >> "$GITHUB_OUTPUT"; else echo "web=true" >> "$GITHUB_OUTPUT"; fi

      - name: Preparar la llave del servidor
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Sin -H y solo ed25519: las entradas con hash y de varios
          # tipos hacen que Net::SSH (el cliente Ruby de Kamal) falle
          # con HostKeyMismatch.
          ssh-keyscan -t ed25519 159.195.235.225 >> ~/.ssh/known_hosts

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Instalar Kamal
        run: gem install kamal -v "~> 2.0"

      - uses: docker/setup-buildx-action@v3

      # EL SITIO PRIMERO, siempre. El certificado del host solo lo puede
      # pedir el servicio de la raiz — ver el comentario que encabeza
      # config/deploy.web.yml. Es al reves que en UparYa.
      - name: Desplegar el sitio
        if: steps.cambios.outputs.web == 'true'
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: kamal deploy -c config/deploy.web.yml

      - name: Desplegar la API
        if: steps.cambios.outputs.api == 'true'
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: kamal deploy -c config/deploy.api.yml
