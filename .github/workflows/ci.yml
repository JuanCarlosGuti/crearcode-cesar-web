name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Spring Boot + ArchUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: mvn verify (unitarias + ArchUnit + integracion con Testcontainers)
        working-directory: backend
        run: ./mvnw --batch-mode verify

  frontend:
    name: Frontend (Angular build + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: npm test (Vitest)
        working-directory: frontend
        run: npm test -- --watch=false

      - name: npm run build (SSR)
        working-directory: frontend
        run: npm run build
