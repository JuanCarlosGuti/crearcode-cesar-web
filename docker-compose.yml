services:
  postgres:
    image: postgres:18-alpine
    container_name: crearcode-leads-postgres
    environment:
      POSTGRES_DB: leads
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: leads
    ports:
      # 5433 en el host: el 5432 por defecto puede estar ocupado por otro
      # proyecto local; el puerto interno del contenedor sigue siendo 5432.
      - "5433:5432"
    volumes:
      # Desde la imagen oficial de Postgres 18, el punto de montaje
      # correcto es /var/lib/postgresql (no .../data): la imagen gestiona
      # internamente un subdirectorio versionado para soportar pg_upgrade.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leads -d leads"]
      interval: 5s
      timeout: 5s
      retries: 5

  # SMTP local de desarrollo (fase F8): el backend envia los correos de
  # verificacion/recuperacion aqui (localhost:1025, el default de
  # MAIL_HOST/MAIL_PORT) y la bandeja se consulta en http://localhost:8025
  # (UI y API REST -- el e2e de cuentas lee el enlace del correo por esa
  # API). En el perfil por defecto, junto a Postgres.
  mailpit:
    image: axllent/mailpit
    container_name: crearcode-leads-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Backend y frontend quedan en el perfil "full": `docker compose up -d`
  # (sin perfil) sigue levantando solo Postgres, como hasta ahora, para no
  # romper el flujo de desarrollo normal (mvnw spring-boot:run + npm start,
  # con hot-reload). `docker compose --profile full up --build` levanta el
  # stack completo containerizado, usando los mismos Dockerfile de
  # produccion (ISS-081) -- util para probar el proxy/imagenes tal como
  # correrian en Render, sin depender de Java/Node instalados en el host.
  backend:
    build:
      context: ./backend
    container_name: crearcode-leads-backend
    profiles: ["full"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: leads
      DB_USER: leads
      DB_PASSWORD: leads
      MAIL_HOST: mailpit
    ports:
      # 8080 en el host puede estar ocupado (ej. por Docker Desktop en esta
      # maquina) -- sobreescribir con BACKEND_PORT=8090 (ver CLAUDE.md).
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: crearcode-leads-frontend
    profiles: ["full"]
    environment:
      # "backend", el nombre del servicio de arriba: Docker Compose lo
      # resuelve via DNS interno, sin depender de puertos publicados al host.
      BACKEND_URL: http://backend:8080
      NG_ALLOWED_HOSTS: localhost
    ports:
      - "${FRONTEND_PORT:-4300}:4000"
    depends_on:
      - backend

volumes:
  postgres_data:
