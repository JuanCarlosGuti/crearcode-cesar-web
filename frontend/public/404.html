<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Página no encontrada — Crear Code Cesar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#071115">
  <!--
    Pagina 404 estatica, sin Angular: la sirve Caddy con estado 404 real
    (handle_errors) cuando ninguna ruta prerenderizada ni de sesion
    coincide. Antes la respuesta era un 404 con el cuerpo vacio (QA6 de
    la auditoria): correcto para Google, desorientador para una persona.
    Los colores son los del rediseno (docs/07 §Rediseno tech).
  -->
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #071115; color: #e8f1f2;
      font: 16px/1.6 Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 2rem 1rem;
    }
    main { max-width: 34rem; text-align: center; }
    .codigo { font: 600 0.85rem/1 "JetBrains Mono", ui-monospace, monospace; color: #3ddc97; letter-spacing: .08em; }
    h1 { font-size: clamp(1.75rem, 5vw, 2.5rem); margin: .75rem 0 .5rem; line-height: 1.15; }
    p { color: #9fb3b9; margin: 0 0 1.5rem; }
    nav { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
    a.boton {
      display: inline-block; padding: .7rem 1.2rem; border-radius: .6rem; text-decoration: none; font-weight: 600;
      background: #3ddc97; color: #04130c;
    }
    a.boton--secundario { background: transparent; color: #e8f1f2; box-shadow: inset 0 0 0 1px #1e3640; }
    a:focus-visible { outline: 3px solid #3ddc97; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="codigo">404 — no encontrada</p>
    <h1>Esa página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que la página ya no esté. Lo que sí está: el inicio, las herramientas gratis y una forma de escribirnos.</p>
    <nav aria-label="Salidas">
      <a class="boton" href="/">Ir al inicio</a>
      <a class="boton boton--secundario" href="/herramientas">Probar las herramientas</a>
      <a class="boton boton--secundario" href="/contacto">Contacto</a>
    </nav>
  </main>
</body>
</html>
