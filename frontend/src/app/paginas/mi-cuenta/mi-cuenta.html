<section class="contenedor pagina-cuenta">
  <h1>{{ textos.titulo }}</h1>

  <p>
    {{ textos.sesionIniciadaComo }} <strong>{{ sesion.correo() }}</strong
    >.
  </p>

  <nav class="pagina-cuenta__secciones" aria-label="Secciones de mi cuenta">
    <a routerLink="/mi-cuenta/cotizaciones" class="boton boton-primario">Mis cotizaciones</a>
    <a routerLink="/herramientas" class="boton boton-secundario">Centro de herramientas</a>
  </nav>

  <button type="button" class="boton boton-secundario" (click)="cerrarSesion()">
    {{ textos.botonCerrarSesion }}
  </button>

  <p class="pagina-cuenta__nota">
    {{ textos.notaContrasenaAntes }}
    <a routerLink="/recuperar-contrasena">{{ textos.enlaceRecuperar }}</a>
    {{ textos.notaContrasenaDespues }}
  </p>
</section>
