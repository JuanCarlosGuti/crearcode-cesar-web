@if (caso(); as c) {
  <article class="contenedor caso-detalle">
    <span class="caso-detalle__linea">{{ c.linea }}</span>
    <h1>{{ c.titulo }}</h1>
    <p class="caso-detalle__stack">{{ c.stack }}</p>

    <section>
      <h2>El reto</h2>
      <p>{{ c.reto }}</p>
    </section>

    <section>
      <h2>La solución</h2>
      <p>{{ c.solucion }}</p>
    </section>

    <section>
      <h2>El resultado</h2>
      <p>{{ c.resultado }}</p>
    </section>

    <div class="cta-doble">
      <a [href]="c.enlace.url" target="_blank" rel="noopener noreferrer" class="boton boton-primario">{{
        c.enlace.etiqueta
      }}</a>
      <a routerLink="/contacto" class="boton boton-secundario">Agenda tu consulta gratuita</a>
    </div>

    <p class="caso-detalle__volver"><a routerLink="/casos">← Ver los demás proyectos</a></p>
  </article>
} @else {
  <section class="contenedor caso-detalle">
    <h1>Caso no encontrado</h1>
    <a routerLink="/casos">Volver al portafolio</a>
  </section>
}
