<footer class="pie">
  <div class="contenedor pie__contenido">
    <div class="pie__columna">
      <h2 class="pie__titulo">{{ empresa.razonSocial }}</h2>
      <p>{{ empresa.ciudad }}</p>
      <!-- Enlaces y no texto plano: en movil abren la app con un toque
           (QA11 de la auditoria). El de WhatsApp lleva el mismo mensaje
           contextual que el boton, para no partir la intencion en dos. -->
      <p>
        WhatsApp:
        <a [href]="urlWhatsappNumero()" target="_blank" rel="noopener">{{ empresa.whatsappNumero }}</a>
      </p>
      <p>
        Correo: <a [href]="'mailto:' + empresa.correo">{{ empresa.correo }}</a>
      </p>
    </div>

    <nav class="pie__columna pie__nav" aria-label="Enlaces del pie de página">
      <a routerLink="/casos">Proyectos</a>
      <a routerLink="/sobre-nosotros">Sobre nosotros</a>
      <a routerLink="/blog">Blog</a>
      <a routerLink="/contacto">Contacto</a>
      <a routerLink="/legales/politica-de-datos">Política de tratamiento de datos</a>
      <a routerLink="/legales/terminos">Términos de uso</a>
    </nav>

    <div class="pie__columna pie__cta">
      <p>Hablemos de tu negocio.</p>
      <div class="cta-doble">
        <a routerLink="/contacto" class="boton boton-claro">Agenda tu consulta</a>
        <app-whatsapp-cta [mensaje]="mensajeWhatsapp()" etiqueta="WhatsApp" />
      </div>
    </div>
  </div>

  <p class="pie__copyright">© {{ anioActual }} {{ empresa.razonSocial }}</p>
</footer>
